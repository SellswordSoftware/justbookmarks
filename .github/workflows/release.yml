name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            output_name: justbookmarks-linux-x64
            output_file: build/bin/justbookmarks
            asset_file: justbookmarks-linux-x64
            wails_tags: webkit2_41
          - name: windows-x64
            runner: windows-2022
            goos: windows
            goarch: amd64
            output_name: justbookmarks-windows-x64
            output_file: build/bin/justbookmarks.exe
            asset_file: justbookmarks-windows-x64.exe
            wails_tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build application (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$(go env GOPATH)/bin/wails" build -clean -platform ${{ matrix.goos }}/${{ matrix.goarch }} -tags "${{ matrix.wails_tags }}"

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$(go env GOPATH)\bin\wails.exe" build -clean -platform ${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.output_file }}" "dist/${{ matrix.asset_file }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.asset_file }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: justbookmarks-linux-x64
          path: release-assets/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: justbookmarks-windows-x64
          path: release-assets/windows

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/linux/justbookmarks-linux-x64
            release-assets/windows/justbookmarks-windows-x64.exe
