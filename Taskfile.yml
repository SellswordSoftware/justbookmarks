version: '3'

vars:
  APP_NAME: "justbookmarks"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application (Linux produces an RPM)
    cmds:
      - task: '{{if eq OS "linux"}}linux:create:rpm{{else}}{{OS}}:build{{end}}'

  build:binary:
    summary: Builds the raw application binary
    cmds:
      - task: "{{OS}}:build"

  build:appimage:
    summary: Builds an AppImage on Linux
    cmds:
      - task: linux:create:appimage

  build:rpm:
    summary: Builds an RPM on Linux
    cmds:
      - task: linux:create:rpm

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
