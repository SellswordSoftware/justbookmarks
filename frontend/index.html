<!doctype html>
<html lang="en" style="background-color: rgb(32, 32, 32);">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JustBookmarks</title>
        <style>
            /* Hide app until JS is ready to prevent FOUC */
            .app-shell[data-loading] {
                visibility: hidden;
            }
        </style>
    </head>
    <body>
        <div id="app" class="app-shell" data-theme="dark" data-loading>
            <div
                id="window-resize-handles"
                class="window-resize-handles"
                aria-hidden="true"
            >
                <div class="window-resize-handle window-resize-handle--n" data-resize-edge="n"></div>
                <div class="window-resize-handle window-resize-handle--e" data-resize-edge="e"></div>
                <div class="window-resize-handle window-resize-handle--s" data-resize-edge="s"></div>
                <div class="window-resize-handle window-resize-handle--w" data-resize-edge="w"></div>
                <div class="window-resize-handle window-resize-handle--ne" data-resize-edge="ne"></div>
                <div class="window-resize-handle window-resize-handle--nw" data-resize-edge="nw"></div>
                <div class="window-resize-handle window-resize-handle--se" data-resize-edge="se"></div>
                <div class="window-resize-handle window-resize-handle--sw" data-resize-edge="sw"></div>
            </div>
            <header
                id="titlebar"
                class="titlebar"
                data-shell-region="titlebar"
                data-wails-drag
                style="--wails-draggable: drag"
            ></header>

            <div class="app-toolbar">
                <section
                    id="search-area"
                    class="search-shell"
                    aria-label="Search"
                >
                    <input
                        id="search-input"
                        class="input search-shell__input"
                        type="search"
                        placeholder="Search bookmarks..."
                        autocomplete="off"
                        data-focus-zone="search"
                        data-keyboard-action="search-input"
                    />
                </section>
                <div id="toolbar-actions"></div>
            </div>

            <div id="page-host" class="page-host"></div>
            <main id="main-content" class="shell-layout">
                <div id="empty-library-host" class="empty-library-host"></div>
                <section
                    id="tree-pane"
                    class="shell-panel tree-pane"
                    aria-labelledby="tree-pane-title"
                >
                    <div class="shell-panel__header">
                        <div class="tree-pane__heading">
                            <span class="eyebrow shell-panel__eyebrow">Library</span>
                            <span
                                id="tree-pane-meta"
                                class="shell-panel__subtitle"
                                >Waiting for state modules</span
                            >
                            <h2
                                id="tree-pane-title"
                                class="shell-panel__title visually-hidden"
                            >
                                Bookmark Tree
                            </h2>
                        </div>
                        <div class="tree-pane__header-right">
                            <div
                                id="tree-pane-actions"
                                class="tree-pane__actions"
                            ></div>
                        </div>
                    </div>
                    <div
                        id="tree-pane-content"
                        class="shell-panel__body tree-pane__list"
                        data-focus-zone="tree"
                        tabindex="0"
                    >
                        <div id="tree-list"></div>
                    </div>
                </section>

                <button
                    id="pane-resizer"
                    class="resizer"
                    type="button"
                    aria-label="Resize panes"
                ></button>

                <section
                    id="detail-pane"
                    class="shell-panel detail-pane"
                    aria-labelledby="detail-pane-title"
                >
                    <div class="shell-panel__header">
                        <div>
                            <span class="eyebrow shell-panel__eyebrow">Detail</span>
                        </div>
                        <span
                            id="detail-pane-meta"
                            class="shell-panel__subtitle"
                            >No selection yet</span
                        >
                    </div>
                    <div
                        id="detail-pane-content"
                        class="shell-panel__body detail-pane__content"
                        data-focus-zone="detail"
                        tabindex="-1"
                    ></div>
                </section>
            </main>

            <div
                id="toast-container"
                class="overlay-root"
                aria-live="polite"
                aria-atomic="true"
            ></div>
            <div id="confirm-modal-container" class="overlay-root"></div>
            <div id="move-dialog-container" class="overlay-root"></div>
            <div id="import-merge-dialog-container" class="overlay-root"></div>
            <div
                id="keyboard-shortcuts-dialog-container"
                class="overlay-root"
            ></div>
        </div>

        <script type="module">
            // __TEST_MODE__ is injected by Vite: true in dev, false in production.
            // In production builds, this entire block is tree-shaken away.
            if (__TEST_MODE__) {
                const url = new URL(window.location.href);
                const testMode = url.searchParams.get("test");
                if (testMode === "json" || testMode === "html") {
                    // Browser test harness -- await blocks load event until tests complete,
                    // which is required for --dump-dom to capture the final DOM state.
                    await import("./tests/browser/run.js");
                } else {
                    // Normal app startup
                    import("./src/main.js");
                }
            } else {
                // Normal app startup (production)
                import("./src/main.js");
            }
        </script>
    </body>
</html>
